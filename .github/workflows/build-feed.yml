# Save this in your repo at: .github/workflows/build-feed.yml
name: Build AI feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: write             # lets the workflow commit the updated feed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Build feed
        run: python ai_feed.py
        env:
          ARXIV_KEYWORDS: ${{ vars.ARXIV_KEYWORDS }}

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update AI feed"
            git push
          fi
